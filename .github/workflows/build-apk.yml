name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      # Если в репозиторий загружен архив DeepSeekWatch.zip — распаковываем его.
      # Так структура папок гарантированно сохраняется.
      - name: Найти проект
        run: |
          if [ -f DeepSeekWatch.zip ]; then
            echo "Найден DeepSeekWatch.zip — распаковываю"
            unzip -q -o DeepSeekWatch.zip -d _src
            SETTINGS=$(find _src -name settings.gradle.kts | head -n 1)
          else
            SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::Не найден settings.gradle.kts. Загрузите в репозиторий DeepSeekWatch.zip целиком."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Папка проекта: $DIR"
          echo "--- файлы проекта ---"
          find "$DIR" -type f -not -path "*/.git/*" | sort
          if [ ! -f "$DIR/app/build.gradle.kts" ] || [ ! -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Нет папки app (app/build.gradle.kts, app/src/...). Папки не загрузились — загрузите в репозиторий архив DeepSeekWatch.zip целиком."
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Необязательно: секрет DEEPSEEK_API_KEY вшивает ключ в APK.
      # Settings → Secrets and variables → Actions. Только для приватного репозитория!
      - name: local.properties
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "deepseek.apiKey=$DEEPSEEK_API_KEY" >> local.properties
          fi

      - name: Сборка
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekWatch-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
